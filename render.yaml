services:
  - type: web
    name: tomatoguard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: CORS_ORIGINS
        value: https://tomatoguard-frontend.onrender.com,http://localhost:5173
      - key: DEVICE_API_KEY
        generateValue: true

  - type: web
    name: tomatoguard-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://tomatoguard-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
